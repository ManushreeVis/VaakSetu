<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="bridge-grad" x1="12" y1="20" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg-grad)" />

  <!-- Bridge Arc (Setu) -->
  <path d="M 14 38 C 22 22, 42 22, 50 38" stroke="url(#bridge-grad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#shadow)" />
  
  <!-- Soundwave / Speech Loops (Vaak) -->
  <path d="M 22 42 C 22 42, 28 32, 32 32 C 36 32, 42 42, 42 42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" fill="none" />
  
  <!-- Devanagari Headline Accent / Bridge Pier Marks -->
  <circle cx="20" cy="38" r="2.5" fill="#FFFFFF" />
  <circle cx="32" cy="24" r="3" fill="#F59E0B" />
  <circle cx="44" cy="38" r="2.5" fill="#FFFFFF" />

  <!-- Dynamic Speech Waves -->
  <path d="M 16 26 Q 20 22 24 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
  <path d="M 40 25 Q 44 22 48 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
</svg>
